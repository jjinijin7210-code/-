<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>video-maker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="page-header">
    <h1>🎬 video-maker</h1>
    <p>정지 이미지에 줌/팬 효과와 전환, 배경음악을 입혀 뮤직비디오를 만듭니다.</p>
  </header>

  <div id="user-bar" class="user-bar hidden">
    <img id="user-avatar" src="" alt="" />
    <span id="user-email"></span>
    <button id="logout-btn" type="button">로그아웃</button>
  </div>

  <main>
    <section class="panel">
      <h2>기본 설정</h2>
      <div class="settings-grid">
        <label>화면 비율
          <select id="aspect-preset">
            <option value="9:16">9:16 (세로 · 쇼츠/릴스/틱톡)</option>
            <option value="16:9">16:9 (가로 · 유튜브)</option>
            <option value="1:1">1:1 (정사각형 · 인스타 피드)</option>
            <option value="4:5">4:5 (인스타 세로 피드)</option>
            <option value="custom">직접 입력</option>
          </select>
        </label>
        <label>FPS <input type="number" id="fps" value="24" /></label>
        <label>전환 길이(초) <input type="number" id="transitionDuration" value="0.6" step="0.1" /></label>
      </div>
      <div id="custom-size" class="settings-grid hidden">
        <label>가로 <input type="number" id="width" value="720" /></label>
        <label>세로 <input type="number" id="height" value="1280" /></label>
      </div>
      <div class="settings-grid">
        <label>배경음악 (선택) <input type="file" id="audio" accept="audio/*" /></label>
        <label>음량 <input type="number" id="audioVolume" value="1" step="0.1" min="0" max="2" /></label>
      </div>
    </section>

    <section class="panel">
      <div class="panel-header-row">
        <h2>씬 목록</h2>
        <button id="add-scene" class="btn btn-primary" type="button">+ 씬 추가</button>
      </div>
      <div id="scenes"></div>
    </section>

    <section class="panel">
      <button id="render-btn" class="btn btn-render" type="button">영상 만들기</button>
      <p id="status" class="status-text"></p>
      <div id="result" class="result hidden">
        <video id="result-video" controls></video>
        <a id="download-link" class="btn btn-secondary" download="video.mp4">다운로드</a>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
