services:
  - type: web
    name: video-maker
    runtime: docker
    dockerfilePath: ./video-maker/Dockerfile
    dockerContext: ./video-maker
    plan: free
    envVars:
      - key: PORT
        value: 4173
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PEXELS_API_KEY
        sync: false
