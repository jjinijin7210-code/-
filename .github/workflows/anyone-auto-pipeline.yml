name: 애니원 자동 파이프라인 (소싱→초안→검수)

# 하루 5번, 서로 다른 생활용품 카테고리로 anyone-dashboard의 /api/auto/run을 호출해서
# 사람 개입 없이 상품 소싱 → AI 초안 생성 → 2중3중 검수까지 자동으로 돌린다.
# Render 무료 서버는 요청이 없으면 잠들기 때문에, 이 스케줄이 매번 서버를 깨우는 역할도 겸한다.
on:
  schedule:
    - cron: '0 0 * * *'  # 매일 UTC 00:00 = 한국시간(KST) 오전 9시 - 수납정리
    - cron: '0 3 * * *'  # 매일 UTC 03:00 = 한국시간(KST) 낮 12시 - 주방용품
    - cron: '0 6 * * *'  # 매일 UTC 06:00 = 한국시간(KST) 오후 3시 - 욕실용품
    - cron: '0 9 * * *'  # 매일 UTC 09:00 = 한국시간(KST) 오후 6시 - 인테리어 소품
    - cron: '0 12 * * *' # 매일 UTC 12:00 = 한국시간(KST) 오후 9시 - 조명
  workflow_dispatch:
    inputs:
      keyword:
        description: '소싱 키워드 (중국어, 비워두면 收纳 사용)'
        required: false
        default: '收纳'

jobs:
  run-auto-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 실행 시각에 맞는 카테고리 키워드 결정
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            '0 0 * * *') KEYWORD='收纳' ;;
            '0 3 * * *') KEYWORD='厨房用品' ;;
            '0 6 * * *') KEYWORD='浴室用品' ;;
            '0 9 * * *') KEYWORD='家居摆件' ;;
            '0 12 * * *') KEYWORD='灯具' ;;
            *)
              KEYWORD="${{ github.event.inputs.keyword }}"
              if [ -z "$KEYWORD" ]; then KEYWORD='收纳'; fi
              ;;
          esac
          echo "keyword=$KEYWORD" >> "$GITHUB_OUTPUT"

      - name: 소싱→초안→검수 파이프라인 호출
        run: |
          set -e
          RESPONSE=$(curl -sS -X POST "https://anyone-dashboard-p3an.onrender.com/api/auto/run" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${{ secrets.AUTO_RUN_SECRET }}\",\"keyword\":\"${{ steps.pick.outputs.keyword }}\",\"channel\":\"인스타/틱톡\"}")
          echo "$RESPONSE"
          echo "## 실행 결과 (키워드: ${{ steps.pick.outputs.keyword }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPONSE" | grep -q '"ok":true'
