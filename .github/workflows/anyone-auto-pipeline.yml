name: 애니원 자동 파이프라인 (일본 벤치마킹→초안→검수)

# 하루 7번, 일본 인스타/틱톡 트렌드 카테고리를 순환하며 anyone-dashboard의
# /api/benchmark/content-run을 호출해서 사람 개입 없이 벤치마킹→AI 초안 생성→2중3중 검수까지
# 자동으로 돌린다. 첫 실행(하루 1번, KST 09:00) 때는 그날의 벤치마킹 데이터부터 새로 수집한다.
# Render 무료 서버는 요청이 없으면 잠들기 때문에, 이 스케줄이 매번 서버를 깨우는 역할도 겸한다.
#
# 참고: 이전에는 1688 상품 소싱 기반(/api/auto/run)이었으나, 2026-07-15부로 일본 벤치마킹
# 기반으로 교체했다. 1688 파이프라인 코드는 그대로 남아있어 필요하면 다시 전환 가능.
#
# 2026-07-19: BENCHMARK_CATEGORIES의 "상품소싱" 카테고리는 실제 상품이 아니라 해시태그
# 트렌드만 보고 AI가 상상해서 쓴 콘텐츠라, 실제로 어떤 상품인지 알 수 없어 구매 링크를
# 만들 수 없다는 문제가 있었다(사용자 보고). 그래서 이 카테고리는 자동 스케줄에서 빼고
# 여행지/패션뷰티소품처럼 실제 상품 연결이 필요 없는 카테고리로만 자동 발행하도록 바꿨다.
# 진짜 상품 소싱(1688→쿠팡 존재 확인→승인)은 BenchmarkReports.jsx의 수동 승인 흐름으로만 한다.
#
# 2026-07-19 (같은 날 추가 변경): 패션뷰티소품·여행지도 반응이 약하고 그림체가 식상하다는
# 피드백으로 전부 빼고, "해외 인기 동물/재밌는영상"(신기한동물/해외재밌는영상) 두 카테고리로
# 전면 교체(사용자 결정, benchmarkCategories.js 참고).
#
# 2026-07-19 (같은 날 추가 변경 #2): "인스타는 꼭 하루 5개 이상 올려야 한다"는 요청으로 5회→7회로
# 늘림 - 검수 반려로 일부 슬롯이 날아가도 실사용 가능한 게시물이 5개 이상 남도록 여유분 확보.
on:
  schedule:
    - cron: '0 0 * * *'  # 매일 UTC 00:00 = 한국시간(KST) 오전 9시 - 벤치마킹 수집 + 신기한동물
    - cron: '0 2 * * *'  # 매일 UTC 02:00 = 한국시간(KST) 오전 11시 - 해외재밌는영상
    - cron: '0 4 * * *'  # 매일 UTC 04:00 = 한국시간(KST) 오후 1시 - 신기한동물
    - cron: '0 6 * * *'  # 매일 UTC 06:00 = 한국시간(KST) 오후 3시 - 해외재밌는영상
    - cron: '0 8 * * *'  # 매일 UTC 08:00 = 한국시간(KST) 오후 5시 - 신기한동물
    - cron: '0 10 * * *' # 매일 UTC 10:00 = 한국시간(KST) 오후 7시 - 해외재밌는영상
    - cron: '0 12 * * *' # 매일 UTC 12:00 = 한국시간(KST) 오후 9시 - 신기한동물
  workflow_dispatch:
    inputs:
      category:
        description: '벤치마킹 카테고리 (비워두면 신기한동물 사용)'
        required: false
        default: '신기한동물'
      collect:
        description: '벤치마킹부터 새로 수집할지 (true/false)'
        required: false
        default: 'true'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 실행 시각에 맞는 카테고리 결정 (+ 최초 실행 시 벤치마킹 수집 여부)
        id: pick
        run: |
          COLLECT=false
          case "${{ github.event.schedule }}" in
            '0 0 * * *') CATEGORY='신기한동물'; COLLECT=true ;;
            '0 2 * * *') CATEGORY='해외재밌는영상' ;;
            '0 4 * * *') CATEGORY='신기한동물' ;;
            '0 6 * * *') CATEGORY='해외재밌는영상' ;;
            '0 8 * * *') CATEGORY='신기한동물' ;;
            '0 10 * * *') CATEGORY='해외재밌는영상' ;;
            '0 12 * * *') CATEGORY='신기한동물' ;;
            *)
              CATEGORY="${{ github.event.inputs.category }}"
              if [ -z "$CATEGORY" ]; then CATEGORY='신기한동물'; fi
              COLLECT="${{ github.event.inputs.collect }}"
              if [ -z "$COLLECT" ]; then COLLECT=true; fi
              ;;
          esac
          echo "category=$CATEGORY" >> "$GITHUB_OUTPUT"
          echo "collect=$COLLECT" >> "$GITHUB_OUTPUT"

      - name: 일본 벤치마킹 수집 (하루 1번, 첫 실행 때만)
        if: steps.pick.outputs.collect == 'true'
        run: |
          RESPONSE=$(curl -sS -X POST "https://anyone-dashboard-p3an.onrender.com/api/benchmark/collect" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${{ secrets.AUTO_RUN_SECRET }}\"}")
          echo "$RESPONSE"
          echo "## 벤치마킹 수집 결과" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 벤치마킹 기반 콘텐츠 초안 생성
        run: |
          set -e
          RESPONSE=$(curl -sS -X POST "https://anyone-dashboard-p3an.onrender.com/api/benchmark/content-run" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${{ secrets.AUTO_RUN_SECRET }}\",\"category\":\"${{ steps.pick.outputs.category }}\",\"channel\":\"인스타/틱톡\"}")
          echo "$RESPONSE"
          echo "## 콘텐츠 생성 결과 (카테고리: ${{ steps.pick.outputs.category }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPONSE" | grep -q '"ok":true'
