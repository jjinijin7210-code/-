name: 애니원 자동 파이프라인 (소싱→초안→검수)

# 매일 정해진 시간에 anyone-dashboard의 /api/auto/run을 호출해서
# 사람 개입 없이 상품 소싱 → AI 초안 생성 → 2중3중 검수까지 자동으로 돌린다.
# Render 무료 서버는 요청이 없으면 잠들기 때문에, 이 스케줄이 매번 서버를 깨우는 역할도 겸한다.
on:
  schedule:
    - cron: '0 1 * * *'  # 매일 UTC 01:00 = 한국시간(KST) 오전 10시
    - cron: '0 11 * * *' # 매일 UTC 11:00 = 한국시간(KST) 저녁 8시
  workflow_dispatch: {} # GitHub Actions 화면에서 "Run workflow" 버튼으로 수동 테스트도 가능

jobs:
  run-auto-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 소싱→초안→검수 파이프라인 호출
        run: |
          set -e
          RESPONSE=$(curl -sS -X POST "https://anyone-dashboard-p3an.onrender.com/api/auto/run" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${{ secrets.AUTO_RUN_SECRET }}\",\"keyword\":\"원피스\",\"channel\":\"인스타/틱톡\"}")
          echo "$RESPONSE"
          echo "## 실행 결과" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPONSE" | grep -q '"ok":true'
