name: 애니원 유튜브팀 트렌드 리서치

# 여러 나라(미국·한국·일본) 인기 영상을 하루 1번 자동으로 검색해서 benchmark_reports에 쌓아둔다.
#
# 2026-07-19: 심리학 유튜브 영상 실제 제작(/api/youtube/psychology-video-run)도 추가했지만,
# 아직 자동 스케줄에는 안 넣었다 - 결과 품질/소요시간/비용을 사용자가 먼저 확인한 뒤 자동 주기를
# 정하기로 함. 지금은 workflow_dispatch로 "make_video"를 true로 주고 수동 실행해야만 돈다.
on:
  schedule:
    - cron: '0 4 * * *'  # 매일 UTC 04:00 = 한국시간(KST) 오후 1시
  workflow_dispatch:
    inputs:
      make_video:
        description: '리서치 대신 심리학 영상을 실제로 만들지 (true/false)'
        required: false
        default: 'false'
      format:
        description: '영상 형식 (shorts | long) - make_video가 true일 때만 사용'
        required: false
        default: 'shorts'

jobs:
  run-research:
    if: github.event.inputs.make_video != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 다지역 유튜브 트렌드 검색
        run: |
          set -e
          RESPONSE=$(curl -sS -X POST "https://anyone-dashboard-p3an.onrender.com/api/youtube/auto-research" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${{ secrets.AUTO_RUN_SECRET }}\"}" \
            --max-time 60)
          echo "$RESPONSE"
          echo "## 유튜브팀 리서치 결과" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPONSE" | grep -q '"ok":true'

  make-video:
    if: github.event.inputs.make_video == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 심리학 유튜브 영상 제작
        run: |
          set -e
          RESPONSE=$(curl -sS -X POST "https://anyone-dashboard-p3an.onrender.com/api/youtube/psychology-video-run" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${{ secrets.AUTO_RUN_SECRET }}\",\"format\":\"${{ github.event.inputs.format }}\"}" \
            --max-time 280)
          echo "$RESPONSE"
          echo "## 심리학 유튜브 영상 제작 결과" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPONSE" | grep -q '"ok":true'
