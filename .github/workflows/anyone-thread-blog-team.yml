name: 애니원 스레드/블로그팀 자동 생성

# 인스타/틱톡팀(anyone-auto-pipeline.yml)과는 별개 팀 - 하루 3번(스레드 1번, 여행 블로그 1번,
# 트렌드 블로그 1번) AI 초안 생성 + 검수까지 자동으로 돌린다.
#
# 2026-07-19: 스레드는 후보 주제들의 실제 스레드 반응(좋아요·댓글)을 확인해서 그날 더 잘 통하는
# 주제를 고르고, 블로그는 "블로그(네이버)-트렌드" 슬롯을 하나 추가해서 네이버 검색 트렌드로
# 푸드/생활 중 하나를 골라 발행한다(여행 블로그는 휴가철이라 그대로 유지 - 사용자 요청).
# 실제 트렌드 확인 로직은 server/routes/threadBlogAuto.js에 있다.
on:
  schedule:
    - cron: '30 1 * * *'  # 매일 UTC 01:30 = 한국시간(KST) 오전 10시30분 - 스레드
    - cron: '30 7 * * *'  # 매일 UTC 07:30 = 한국시간(KST) 오후 4시30분 - 여행 블로그
    - cron: '30 10 * * *' # 매일 UTC 10:30 = 한국시간(KST) 오후 7시30분 - 트렌드 블로그(푸드/생활)
  workflow_dispatch:
    inputs:
      channel:
        description: '채널 (비워두면 스레드)'
        required: false
        default: '스레드'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 실행 시각에 맞는 채널 결정
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            '30 1 * * *') CHANNEL='스레드' ;;
            '30 7 * * *') CHANNEL='블로그(네이버)-여행' ;;
            '30 10 * * *') CHANNEL='블로그(네이버)-트렌드' ;;
            *)
              CHANNEL="${{ github.event.inputs.channel }}"
              if [ -z "$CHANNEL" ]; then CHANNEL='스레드'; fi
              ;;
          esac
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: 스레드/블로그 콘텐츠 초안 생성
        run: |
          set -e
          RESPONSE=$(curl -sS -X POST "https://anyone-dashboard-p3an.onrender.com/api/thread-blog/auto-run" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${{ secrets.AUTO_RUN_SECRET }}\",\"channel\":\"${{ steps.pick.outputs.channel }}\"}" \
            --max-time 280)
          echo "$RESPONSE"
          echo "## 스레드/블로그 생성 결과 (채널: ${{ steps.pick.outputs.channel }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPONSE" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "$RESPONSE" | grep -q '"ok":true'
