<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>실시간 통역기</title>
<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#0b1220"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="통역기"><link rel="apple-touch-icon" href="/icon.svg"><link rel="icon" href="/icon.svg">
<link rel="stylesheet" href="/styles.css"></head><body>
<header>
  <span class="logo">🌐</span>
  <div><strong>실시간 통역기</strong><small>말하면 바로 번역해서 들려줘요</small></div>
</header>

<main>
  <div class="panel">
    <label>상대방 언어</label>
    <select id="targetLang">
      <option value="mn">🇲🇳 몽골어</option>
      <option value="en">🇺🇸 영어</option>
      <option value="zh">🇨🇳 중국어</option>
      <option value="ja">🇯🇵 일본어</option>
    </select>
    <div id="voiceWarning" class="voice-warning hidden"></div>
  </div>

  <div id="conversationLog" class="conversation-log">
    <p class="conversation-empty">마이크 버튼을 누르고 말하면 여기에 대화가 쌓여요.</p>
  </div>

  <div class="mic-row">
    <button id="micKo" class="mic-btn" type="button">
      <span class="mic-icon">🎤</span>
      <span class="mic-label">한국어로 말하기</span>
    </button>
    <button id="micTarget" class="mic-btn" type="button">
      <span class="mic-icon">🎤</span>
      <span class="mic-label" id="micTargetLabel">몽골어로 말하기</span>
    </button>
  </div>

  <div class="text-input-row">
    <input id="textInput" type="text" placeholder="말 대신 글자로 입력해도 돼요" />
  </div>
  <div class="text-btn-row">
    <button id="sendKoToTarget" class="text-btn" type="button">한국어 → <span class="target-name">몽골어</span></button>
    <button id="sendTargetToKo" class="text-btn" type="button"><span class="target-name">몽골어</span> → 한국어</button>
  </div>

  <p id="statusLine" class="status-line"></p>
  <div id="unsupportedNotice" class="voice-warning hidden">
    이 브라우저는 음성 인식을 지원하지 않아요. 안드로이드/PC의 최신 Chrome에서 열어주세요.
  </div>
</main>
<footer>번역은 참고용이에요, 중요한 대화는 한 번 더 확인해주세요.</footer>
<script src="/translator.js"></script>
</body></html>
