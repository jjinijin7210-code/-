<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>워터마크 마스터 스튜디오</title><link rel="stylesheet" href="style.css"><style>.select-guide{width:max-content;max-width:100%;margin:0 auto 12px;padding:10px 16px;border:1px solid #8172ff;border-radius:10px;background:#7967ff1c;color:#d8d3ff;font-size:13px;font-weight:800;text-align:center}.select-guide.done{border-color:#36c98f;background:#36c98f18;color:#aaf0d4}.stage{touch-action:none}.stage img{-webkit-user-drag:none;user-select:none}.file-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding:10px 12px;border-radius:10px;background:#0e1118}.file-toolbar span{overflow:hidden;color:#b9bfcc;font-size:13px;text-overflow:ellipsis;white-space:nowrap}.file-toolbar .danger{flex:none;padding:8px 12px;background:#522b36;color:#ffc3cf;font-size:12px}.file-toolbar .danger:hover{background:#713545}#sourceSelection{display:none;position:absolute;border:2px solid #35e6a1;background:#35e6a126;box-shadow:0 0 0 1px #071c14;pointer-events:none}#pickSource.active{background:#16875f;box-shadow:0 0 0 3px #35e6a133}</style></head><body>
<main><header><span class="badge">LOCAL · PRIVATE</span><h1>워터마크 마스터 스튜디오</h1><p>이미지나 영상을 올리고, 지울 부분을 마우스로 드래그하세요.</p></header>
<section class="panel"><label class="drop" id="dropZone" for="file"><strong>이미지 또는 영상 선택</strong><span>클릭하거나 파일을 이 탭으로 끌어다 놓으세요 · PNG, JPG, WEBP, MP4, MOV 등</span><input id="file" type="file" accept="image/*,video/*"></label>
<div id="editor" class="editor hidden"><div class="file-toolbar"><span id="fileName"></span><button id="clearUpload" class="danger" type="button">업로드 파일 삭제</button></div><div id="selectGuide" class="select-guide">① 지울 부분을 마우스로 꾹 누른 채 네모로 드래그하세요</div><div class="stage" id="stage"><img id="image" class="hidden" alt="미리보기" draggable="false"><video id="video" class="hidden" controls></video><div id="selection"></div><div id="sourceSelection"></div></div><p class="hint">보라색은 지울 영역, 초록색은 가져올 깨끗한 배경입니다. 영상은 원하는 시점에서 정지한 뒤 구간을 지정할 수 있어요.</p>
<div id="range" class="range hidden"><div><label>시작 시간</label><div class="time-row"><input id="startTime" type="number" min="0" step="0.1" value="0"><button id="setStart" class="tiny ghost">현재 시간</button></div></div><div><label>종료 시간</label><div class="time-row"><input id="endTime" type="number" min="0" step="0.1"><button id="setEnd" class="tiny ghost">현재 시간</button></div></div></div>
<div class="actions"><button id="reset" class="ghost">선택 지우고 다시 그리기</button><button id="pickSource" class="ghost hidden" disabled>② 깨끗한 배경 선택</button><button id="add" disabled>먼저 지울 영역을 드래그하세요</button></div><div id="jobs" class="jobs hidden"></div><div class="actions final-action"><button id="remove" disabled>등록한 작업으로 자연스럽게 지우기</button></div></div>
<div id="status"></div><div id="result" class="hidden"></div></section>
<footer>본인이 소유하거나 편집 권한이 있는 파일에만 사용하세요. 파일은 외부로 전송되지 않습니다.</footer></main><script src="app.js"></script></body></html>
